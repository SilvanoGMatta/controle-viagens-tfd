<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supersys · Sistemas</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap { width: 100%; max-width: 640px; }
    header { text-align: center; color: #e2e8f0; margin-bottom: 32px; }
    header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
    header p { margin: 0; opacity: .8; font-size: 15px; }
    .cards { display: grid; gap: 16px; }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #fff;
      border-radius: 14px;
      padding: 20px 22px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
    .icon {
      flex: 0 0 52px;
      width: 52px; height: 52px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff;
    }
    .icon.tfd { background: linear-gradient(135deg, #0ea5e9, #2563eb); }
    .icon.fiscal { background: linear-gradient(135deg, #16a34a, #059669); }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .card span { font-size: 13px; color: #64748b; }
    .arrow { margin-left: auto; color: #94a3b8; font-size: 22px; }
    footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Supersys</h1>
      <p>Selecione o sistema que deseja acessar</p>
    </header>

    <div class="cards">
      <a class="card" href="Sistema%20TFD%20%28offline%29.html">
        <div class="icon tfd">🚑</div>
        <div>
          <h2>Sistema TFD</h2>
          <span>Gestão de Tratamento Fora de Domicílio</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="card" href="SuperGestorFiscal.html">
        <div class="icon fiscal">📊</div>
        <div>
          <h2>SuperGestorFiscal</h2>
          <span>Gestão fiscal · Supersys</span>
        </div>
        <div class="arrow">›</div>
      </a>
    </div>

    <footer>© Supersys</footer>
  </div>
</body>
</html>
